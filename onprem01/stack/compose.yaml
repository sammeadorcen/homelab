# onprem01 — home server (Debian 13). No public IP, no port forwards.
# Every service is reachable only over the NetBird mesh.
#
# Copy .env.example to .env and fill it in. Nothing secret lives in this file.

name: stack

networks:
  default:
    name: stack_default
    external: true   # docker network create stack_default

services:

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    # Listens on *:443; UFW only admits wt0 (mesh) and the Docker bridge.
    # Binding to the mesh IP alone breaks container -> Traefik traffic.
    network_mode: host
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CF_API_TOKEN}
      TZ: ${TZ}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Game servers ──────────────────────────────────────────────────────

  pelican:
    image: ghcr.io/pelican/panel:latest       # not pelican-dev/panel
    container_name: pelican
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      APP_URL: https://panel.${DOMAIN}
      APP_TIMEZONE: ${TZ}
      BEHIND_PROXY: "true"                   # else: "lets encrypt email must be set"
      TRUSTED_PROXIES: ${BRIDGE_SUBNET}      # CIDR, else mixed-content CSS
      XDG_DATA_HOME: /pelican-data
      DB_CONNECTION: sqlite                  # else: "nc: bad port ''" loop
      DB_DATABASE: /pelican-data/database/database.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/pelican:/pelican-data         # chown 82:82 first
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panel.rule=Host(`panel.${DOMAIN}`)"
      - "traefik.http.routers.panel.entrypoints=websecure"
      - "traefik.http.routers.panel.service=panel"
      - "traefik.http.routers.panel.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.panel.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

  wings:
    image: ghcr.io/pelican/wings:latest
    container_name: wings
    restart: unless-stopped
    tty: true
    # Wings must call the Panel by its public hostname (websocket origin
    # checks), but that name resolves to the mesh IP, which a container
    # can't route to. Point it at the bridge gateway, where Traefik listens.
    extra_hosts:
      - "panel.${DOMAIN}:${BRIDGE_GATEWAY}"
    environment:
      TZ: ${TZ}
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pelican
    ports:
      - "${MESH_IP}:2022:2022"               # SFTP, mesh only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      - /etc/pelican/:/etc/pelican/
      - /var/lib/pelican/:/var/lib/pelican/
      - /var/log/pelican/:/var/log/pelican/
      - /tmp/pelican/:/tmp/pelican/
      - /etc/ssl/certs:/etc/ssl/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wings.rule=Host(`wings.${DOMAIN}`)"
      - "traefik.http.routers.wings.entrypoints=websecure"
      - "traefik.http.routers.wings.service=wings"
      - "traefik.http.routers.wings.middlewares=hardening@file"
      - "traefik.http.services.wings.loadbalancer.server.port=8080"
      # Updated nightly together with the Panel so the two versions never drift.
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Media: AIOStreams + AIOMetadata (NetBird only, no published ports) ─

  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      BASE_URL: https://aio.${DOMAIN}
      SECRET_KEY: ${AIO_SECRET_KEY}          # never change after first start
      DATABASE_URI: sqlite://./data/db.sqlite
      AIOSTREAMS_AUTH: sam:${AIO_ADMIN_PASSWORD}
    # meta.<domain> resolves to the mesh IP, which a container can't reach.
    # Send it to the bridge gateway, where Traefik listens.
    extra_hosts:
      - "meta.${DOMAIN}:${BRIDGE_GATEWAY}"
      - "aio.${DOMAIN}:${BRIDGE_GATEWAY}"
    volumes:
      - ./data/aiostreams:/app/data
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aio.rule=Host(`aio.${DOMAIN}`)"
      - "traefik.http.routers.aio.entrypoints=websecure"
      - "traefik.http.routers.aio.service=aio"
      - "traefik.http.routers.aio.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.aio.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  aiometadata:
    image: ghcr.io/cedya77/aiometadata:latest
    container_name: aiometadata
    restart: unless-stopped
    init: true
    # No depends_on: Watchtower's rolling restart refuses it. Until Redis is
    # up, this container exits and Docker restarts it.
    environment:
      TZ: ${TZ}
      PORT: "3232"
      NODE_ENV: production
      HOST_NAME: https://meta.${DOMAIN}
      DATABASE_URI: sqlite://addon/data/db.sqlite
      REDIS_URL: redis://aiometadata-redis:6379
      ADMIN_KEY: ${META_ADMIN_KEY}
      BUILT_IN_TMDB_API_KEY: ${TMDB_API_KEY}   # server-side, never sent to browsers
    volumes:
      - ./data/aiometadata:/app/addon/data
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meta.rule=Host(`meta.${DOMAIN}`)"
      - "traefik.http.routers.meta.entrypoints=websecure"
      - "traefik.http.routers.meta.service=meta"
      - "traefik.http.routers.meta.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.meta.loadbalancer.server.port=3232"
      - "com.centurylinklabs.watchtower.enable=true"

  # Cache for AIOMetadata. Needs Redis 8+. Not published anywhere.
  aiometadata-redis:
    image: redis:8-alpine
    container_name: aiometadata-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "3600", "1"]
    volumes:
      - ./data/aiometadata-redis:/data
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Monitoring exporters (scraped by cloud01 over the mesh) ───────────

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    ports:
      - "${MESH_IP}:9100:9100"
    volumes:
      - /:/host:ro,rslave
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg]
    ports:
      - "${MESH_IP}:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Dozzle agent: cloud01's Dozzle shows this box's logs through it.
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    restart: unless-stopped
    command: agent
    environment:
      DOZZLE_HOSTNAME: onprem01
    ports:
      - "${MESH_IP}:7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Read-only Docker API for the dashboard on cloud01. Mesh IP only; POST
  # requests (start/stop/create) are refused.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    ports:
      - "${MESH_IP}:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_TIMEOUT: 90s
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
