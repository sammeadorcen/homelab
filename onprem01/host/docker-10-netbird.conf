# /etc/systemd/system/docker.service.d/10-netbird.conf
#
# Containers bind to the mesh IP. If Docker starts before wt0 exists, those
# binds fail. Make Docker wait for the mesh interface.
#
# onprem01 ONLY. On cloud01 the NetBird server itself runs in Docker, so this
# would deadlock the boot.
[Unit]
After=netbird.service
Wants=netbird.service

[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 60); do ip addr show wt0 2>/dev/null | grep -q "inet 100\." && exit 0; sleep 2; done; echo "wt0 never came up" >&2; exit 1'
