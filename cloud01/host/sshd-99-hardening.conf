# /etc/ssh/sshd_config.d/99-hardening.conf
# Port 22 is closed to the internet (UFW + Linode Cloud Firewall).
# sshd is reachable only over the mesh interface (wt0).
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
AllowUsers youruser
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
