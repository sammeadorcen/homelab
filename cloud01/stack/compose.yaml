# cloud01 — public edge + mesh control plane (Linode, Debian 13)
#
# Public:     Traefik (80/443), Vaultwarden, NetBird (separate project in ../netbird)
# Mesh-only:  everything else, enforced by the mesh-only@file middleware
#
# Copy .env.example to .env and fill it in. Nothing secret lives in this file.

name: stack

# Created by hand (`docker network create stack_default`) so the NetBird
# project can join it as an external network. Traefik runs on host networking
# and never creates it itself.
networks:
  default:
    name: stack_default
    external: true

services:

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    # Host networking, not published ports. Published ports NAT every
    # connection to the bridge gateway before Traefik sees it, which makes
    # IP-based rules (mesh-only, CrowdSec) match nothing useful.
    network_mode: host
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CF_API_TOKEN}   # exact name matters
      TZ: ${TZ}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik:/data
      - ./data/traefik-logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=hardening@file,mesh-only@file"
      # Host networking means the provider can't infer a port for Traefik's
      # own container. The dashboard uses api@internal and ignores this.
      - "traefik.http.services.dashboard-dummy.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Public ────────────────────────────────────────────────────────────

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    # Email (invites, 2FA, new-device alerts) through Google Workspace SMTP,
    # with the same account and app password as Grafana's alerts.
    environment:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURITY: starttls
      SMTP_FROM: ${ALERT_EMAIL}
      SMTP_FROM_NAME: Vaultwarden
      SMTP_USERNAME: ${ALERT_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    restart: unless-stopped
    user: ${PUID_PGID}
    env_file: [./vaultwarden/vaultwarden.env]
    volumes:
      - ./data/vaultwarden:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`vault.${CLOUD_DOMAIN}`) && !PathPrefix(`/admin`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.service=vaultwarden"
      # crowdsec first, so a banned IP is refused before anything else runs
      - "traefik.http.routers.vault.middlewares=crowdsec@file,hardening@file"
      # Admin panel: only on this mesh-only name; /admin is cut off on the public one.
      - "traefik.http.routers.vault-admin.rule=Host(`vault-admin.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.vault-admin.entrypoints=websecure"
      - "traefik.http.routers.vault-admin.service=vaultwarden"
      - "traefik.http.routers.vault-admin.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios Dominic-Wagner/vaultwarden"
    ports:
      # LAPI on loopback only. Traefik (host network) reaches it at 127.0.0.1:8085.
      - "127.0.0.1:8085:8080"
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/stack.yaml:ro
      - ./data/crowdsec/config:/etc/crowdsec
      - ./data/crowdsec/data:/var/lib/crowdsec/data
      - ./data/traefik-logs:/var/log/traefik:ro
      - ./data/vaultwarden/vaultwarden.log:/var/log/vaultwarden.log:ro
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # CrowdSec Web UI: alerts, decisions and metrics. Mesh only, own login.
  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    container_name: crowdsec-web-ui
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      CONFIG_UI_TIME_ZONE: ${TZ}
      CONFIG_UPDATES_ENABLED: "false"          # Watchtower updates it
      CONFIG_INSTANCE_NAME: cloud01
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
      CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: ${CROWDSEC_UI_PASSWORD}
      CONFIG_INSTANCE_METRICS_URL: http://crowdsec:6060/metrics
    volumes:
      - ./data/crowdsec-web-ui:/app/data      # owned by uid 1000 (the image's node user)
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crowdsec-ui.rule=Host(`crowdsec.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.crowdsec-ui.entrypoints=websecure"
      - "traefik.http.routers.crowdsec-ui.service=crowdsec-ui"
      - "traefik.http.routers.crowdsec-ui.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.crowdsec-ui.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Mesh-only: monitoring ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Traefik metrics on the host, :8082
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.routers.prometheus.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "com.centurylinklabs.watchtower.enable=true"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "472"
    environment:
      TZ: ${TZ}
      GF_SERVER_ROOT_URL: https://grafana.${CLOUD_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Alert email through Google Workspace SMTP (app password in .env)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${ALERT_EMAIL}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL}
      GF_SMTP_FROM_NAME: Homelab alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.routers.grafana.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/uptimekuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuma.rule=Host(`status.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.kuma.entrypoints=websecure"
      - "traefik.http.routers.kuma.service=kuma"
      - "traefik.http.routers.kuma.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
      - "com.centurylinklabs.watchtower.enable=true"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_HOSTNAME: cloud01
      DOZZLE_REMOTE_AGENT: onprem01.example.com:7007   # agent on onprem01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.service=dozzle"
      - "traefik.http.routers.dozzle.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Mesh-only: dashboard ──────────────────────────────────────────────

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
      HOMEPAGE_ALLOWED_HOSTS: dash.${CLOUD_DOMAIN}
      HOMEPAGE_VAR_GRAFANA_USER: ${GRAFANA_USER}
      HOMEPAGE_VAR_GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
      HOMEPAGE_VAR_CROWDSEC_PASSWORD: ${CROWDSEC_HOMEPAGE_PASSWORD}
      HOMEPAGE_VAR_CALENDAR_URL: ${CALENDAR_ICAL_URL}
    volumes:
      - ./data/homepage:/app/config
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dash.rule=Host(`dash.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.dash.entrypoints=websecure"
      - "traefik.http.routers.dash.service=dash"
      - "traefik.http.routers.dash.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.dash.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  # Read-only Docker API for Homepage's container status. No published ports.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Sidecar that can see only Homepage's config directory — edit the
  # dashboard from a browser without SSH.
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: ${PUID_PGID}
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/homepage:/srv
      - ./data/filebrowser/database.db:/database.db   # touch it first
    security_opt: [no-new-privileges:true]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.rule=Host(`files.${CLOUD_DOMAIN}`)"
      - "traefik.http.routers.files.entrypoints=websecure"
      - "traefik.http.routers.files.service=files"
      - "traefik.http.routers.files.middlewares=hardening@file,mesh-only@file"
      - "traefik.http.services.files.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Updates ───────────────────────────────────────────────────────────

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"      # only containers that opt in
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_TIMEOUT: 90s
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # 04:00, after the 03:30 backup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt: [no-new-privileges:true]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
