# Lives at data/homer/config.yml. Editable from the browser via Filebrowser.
title: "Homelab"
subtitle: "cloud01 · onprem01"
header: true
footer: false
columns: "3"
connectivityCheck: true
theme: default

services:
  - name: "Network"
    icon: "fas fa-network-wired"
    items:
      - name: "NetBird"
        subtitle: "Peers, users, policies"
        tag: "cloud01"
        url: "https://nb.cloud.example.com"
        target: "_blank"

  - name: "Vault"
    icon: "fas fa-key"
    items:
      - name: "Vaultwarden"
        subtitle: "Passwords — public"
        tag: "cloud01"
        url: "https://vault.cloud.example.com"
        target: "_blank"

  - name: "Monitoring"
    icon: "fas fa-chart-line"
    items:
      - { name: "Grafana",     subtitle: "Metrics",           tag: "cloud01", url: "https://grafana.cloud.example.com", target: "_blank" }
      - { name: "Uptime Kuma", subtitle: "Status checks",     tag: "cloud01", url: "https://status.cloud.example.com",  target: "_blank" }
      - { name: "Dozzle",      subtitle: "Container logs",    tag: "cloud01", url: "https://logs.cloud.example.com",    target: "_blank" }
      - { name: "Traefik",     subtitle: "Routers and certs", tag: "cloud01", url: "https://traefik.cloud.example.com", target: "_blank" }

  - name: "Tools"
    icon: "fas fa-folder-open"
    items:
      - { name: "Filebrowser", subtitle: "Edit this page", tag: "cloud01", url: "https://files.cloud.example.com", target: "_blank" }

  - name: "Home server"
    icon: "fas fa-server"
    items:
      - { name: "Pelican Panel", subtitle: "Game servers", tag: "onprem01", url: "https://panel.example.com", target: "_blank" }
